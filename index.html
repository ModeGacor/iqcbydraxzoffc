<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPhone Quote — DRAXZ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00ffe7;--rose:#ff3f6c;--amber:#ffb800;
  --bg:#060610;--border:rgba(255,255,255,.08);
  --text:#dde8ff;--muted:rgba(221,232,255,.38);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none}
html{height:100%}
body{
  min-height:100vh;
  background:var(--bg);
  /* simple static gradient - no canvas, no animation */
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 20%,rgba(0,255,231,.07) 0%,transparent 70%),
    radial-gradient(ellipse 50% 35% at 85% 80%,rgba(255,63,108,.055) 0%,transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 50%,rgba(255,184,0,.025) 0%,transparent 70%);
  display:flex;justify-content:center;align-items:flex-start;
  font-family:'Outfit',sans-serif;
  overscroll-behavior:none;
}

/* ── GRID BG (CSS only, no JS) ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,231,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,231,.018) 1px,transparent 1px);
  background-size:55px 55px;
}

/* ── APP SHELL ── */
.app{
  width:100%;max-width:420px;min-height:100vh;
  display:flex;flex-direction:column;
  position:relative;z-index:10;
  border-left:1px solid var(--border);border-right:1px solid var(--border);
}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:50;
  padding:16px 20px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(6,6,16,.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,231,.35),transparent);
}
.h-badge{display:flex;align-items:center;gap:11px}
.h-icon{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:rgba(0,255,231,.1);
  border:1px solid rgba(0,255,231,.22);
  display:flex;align-items:center;justify-content:center;
  color:var(--teal);font-size:.85rem;
}
.h-title{
  font-family:'Syne',sans-serif;font-size:.92rem;font-weight:800;
  color:var(--text);letter-spacing:.4px;
}
.h-sub{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--muted);letter-spacing:2px;margin-top:1px}
.h-status{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--teal)}
.s-dot{
  width:6px;height:6px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 6px var(--teal);
  animation:dotBlink 2.5s ease-in-out infinite;
}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── SCROLL ── */
.scroll{
  flex:1;padding:18px 16px 36px;
  overflow-y:auto;
}

/* ── SECTION LABEL ── */
.slabel{
  font-family:'DM Mono',monospace;font-size:.58rem;
  color:var(--teal);letter-spacing:3px;text-transform:uppercase;
  margin-bottom:12px;opacity:.7;
  display:flex;align-items:center;gap:8px;
}
.slabel::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,255,231,.2),transparent)}

/* ── CARD ── */
.gcard{
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:16px;padding:18px;
  margin-bottom:14px;
  position:relative;
}
.gcard::before{
  content:'';position:absolute;top:-1px;left:25%;right:25%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,231,.25),transparent);
  border-radius:2px;
}

/* ── FIELDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.flabel{
  font-size:.63rem;font-weight:600;color:var(--muted);
  letter-spacing:1.3px;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;
}
.flabel i{font-size:.58rem;color:var(--teal);opacity:.7}
.fhint{font-size:.6rem;color:var(--muted);opacity:.5;font-family:'DM Mono',monospace}

input,textarea{
  width:100%;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:12px 13px;
  color:var(--text);font-family:'Outfit',sans-serif;font-size:.87rem;
  -webkit-appearance:none;appearance:none;
  transition:border-color .2s,background .2s;
  letter-spacing:.2px;
}
textarea{min-height:84px;resize:none;line-height:1.5}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.18);font-size:.81rem}
input:focus,textarea:focus{
  border-color:rgba(0,255,231,.4);
  background:rgba(0,255,231,.03);
  box-shadow:0 0 0 3px rgba(0,255,231,.06);
}

/* ── GENERATE BTN ── */
.gen-btn{
  width:100%;padding:15px 20px;
  background:linear-gradient(135deg,rgba(0,255,231,.1),rgba(0,255,231,.03));
  border:1px solid rgba(0,255,231,.28);border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  cursor:pointer;transition:border-color .2s,box-shadow .2s,opacity .2s;
  margin-top:14px;
}
.gen-btn:active:not(:disabled){opacity:.75}
.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-txt{
  font-family:'Syne',sans-serif;font-size:.85rem;font-weight:800;
  letter-spacing:2px;color:#fff;
}
.gen-icon{color:var(--teal);font-size:.82rem}

/* ── LOADING ── */
.loading{display:none;text-align:center;padding:20px 0 8px}
.ring-wrap{position:relative;width:40px;height:40px;margin:0 auto 11px}
.ring-outer{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid rgba(0,255,231,.1);
  border-top-color:var(--teal);
  animation:spin .85s linear infinite;
  position:absolute;inset:0;
}
.ring-inner{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid rgba(255,63,108,.1);
  border-bottom-color:var(--rose);
  animation:spin .6s linear infinite reverse;
  position:absolute;top:7px;left:7px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{
  font-family:'DM Mono',monospace;font-size:.65rem;
  color:var(--teal);opacity:.6;letter-spacing:3px;
  animation:txtBlink 1.2s ease-in-out infinite;
}
@keyframes txtBlink{0%,100%{opacity:.6}50%{opacity:.25}}

/* ── ERROR ── */
.errbox{
  display:none;padding:10px 13px;border-radius:9px;
  background:rgba(255,63,108,.06);border:1px solid rgba(255,63,108,.18);
  color:var(--rose);font-size:.78rem;text-align:center;margin-top:11px;
}

/* ── PREVIEW ── */
.preview-sec{display:none;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px}
.preview-sec.show{display:flex}
.prev-frame{
  width:100%;border-radius:18px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 16px 48px rgba(0,0,0,.55),0 0 30px rgba(0,255,231,.04);
}
.prev-frame img{width:100%;display:block;border-radius:18px}
.prev-acts{display:flex;gap:10px;width:100%}
.dl-btn{
  flex:1;padding:13px;
  background:rgba(0,255,231,.09);
  border:1px solid rgba(0,255,231,.25);border-radius:11px;
  color:var(--teal);font-family:'Syne',sans-serif;font-weight:800;
  font-size:.76rem;letter-spacing:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  text-decoration:none;transition:opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
.dl-btn:active{opacity:.7}
.regen-btn{
  padding:13px 16px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:11px;
  color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;transition:opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
.regen-btn:active{opacity:.7}

/* ── TERMINAL ── */
.terminal{
  background:rgba(0,0,0,.45);
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:4px;
}
.term-head{
  padding:9px 13px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.012);
}
.tdots{display:flex;gap:5px}
.td{width:7px;height:7px;border-radius:50%}
.td.r{background:rgba(255,93,93,.55)}
.td.y{background:rgba(255,184,0,.55)}
.td.g{background:rgba(0,229,100,.55)}
.tname{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--muted);margin-left:3px;letter-spacing:1px}
.term-body{
  padding:10px 13px;height:88px;overflow-y:auto;
  font-family:'DM Mono',monospace;font-size:.65rem;
  scrollbar-width:none;
}
.term-body::-webkit-scrollbar{display:none}
.tline{display:flex;gap:7px;margin-bottom:4px;line-height:1.4}
.tline .p{color:rgba(0,255,231,.28);flex-shrink:0}
.tline.ok .m{color:var(--teal)}
.tline.err .m{color:var(--rose)}
.tline.info .m{color:var(--muted)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:rgba(8,8,18,.96);
  border:1px solid rgba(0,255,231,.2);
  padding:10px 20px;border-radius:50px;
  display:flex;align-items:center;gap:8px;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  z-index:9999;color:var(--text);font-size:.78rem;font-weight:500;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.55);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(255,63,108,.3)}
.toast i{font-size:.72rem}

/* ── ENTRY ANIM (light) ── */
.card-anim{animation:fadeup .4s ease forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="h-badge">
      <div class="h-icon"><i class="fa-brands fa-apple"></i></div>
      <div>
        <div class="h-title">Iphone Quote Generator</div>
        <div class="h-sub">BY DRAXZ</div>
      </div>
    </div>
    <div class="h-status"><div class="s-dot"></div>ONLINE</div>
  </header>

  <div class="scroll">

    <div class="card-anim">
      <div class="slabel" style="margin-top:4px"><i class="fa-solid fa-sliders" style="font-size:.52rem"></i> PARAMETER INPUT</div>
      <div class="gcard">
        <div class="grid2">
          <div class="field">
            <div class="flabel"><i class="fa-regular fa-clock"></i> Jam</div>
            <input type="text" id="time" placeholder="18:00" inputmode="numeric">
            <div class="fhint">Format HH:MM</div>
          </div>
          <div class="field">
            <div class="flabel"><i class="fa-solid fa-battery-half"></i> Baterai</div>
            <input type="number" id="battery" placeholder="40" min="0" max="100" inputmode="numeric">
            <div class="fhint">0 — 100</div>
          </div>
          <div class="field full">
            <div class="flabel"><i class="fa-solid fa-signal"></i> Provider</div>
            <input type="text" id="carrier" placeholder="Telkomsel">
          </div>
          <div class="field full">
            <div class="flabel"><i class="fa-regular fa-comment-dots"></i> Pesan</div>
            <textarea id="message" placeholder="Haii bang..."></textarea>
          </div>
        </div>

        <button class="gen-btn" id="generateBtn">
          <span class="gen-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
          <span class="gen-txt" id="btnTxt">GENERATE QUOTE</span>
        </button>

        <div class="loading" id="loading">
          <div class="ring-wrap">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
          </div>
          <div class="load-txt">PROCESSING...</div>
        </div>
        <div class="errbox" id="errbox"></div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-sec" id="previewArea">
      <div class="slabel" style="width:100%"><i class="fa-regular fa-image" style="font-size:.52rem"></i> PREVIEW RESULT</div>
      <div class="prev-frame">
        <img id="previewImage" alt="iPhone Quote Preview">
      </div>
      <div class="prev-acts">
        <a href="#" class="dl-btn" id="downloadBtn"><i class="fa-solid fa-download"></i> DOWNLOAD</a>
        <button class="regen-btn" id="regenBtn" title="Regenerate"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
    </div>

    <!-- Terminal -->
    <div class="terminal">
      <div class="term-head">
        <div class="tdots">
          <div class="td r"></div>
          <div class="td y"></div>
          <div class="td g"></div>
        </div>
        <span class="tname">SYSTEM LOG</span>
      </div>
      <div class="term-body" id="log">
        <div class="tline info"><span class="p">$</span><span class="m">System initialized...</span></div>
        <div class="tline ok"><span class="p">$</span><span class="m">iPhone Quote Generator ready.</span></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check" id="toastIcon"></i><span id="tmsg"></span></div>

<script>
/* ── INIT TIME ── */
window.addEventListener('load',()=>{
  const now=new Date();
  document.getElementById('time').value=
    String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
});

/* ── UTILS ── */
let toastTimer;
function addLog(msg,type='info'){
  const log=document.getElementById('log');
  const d=document.createElement('div');
  d.className='tline '+type;
  d.innerHTML='<span class="p">$</span><span class="m">'+msg+'</span>';
  log.appendChild(d);
  // keep max 30 lines
  while(log.children.length>30)log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  const icon=document.getElementById('toastIcon');
  document.getElementById('tmsg').textContent=msg;
  icon.className=err?'fa-solid fa-circle-exclamation':'fa-solid fa-circle-check';
  icon.style.color=err?'var(--rose)':'var(--teal)';
  t.classList.toggle('err',err);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}
function setLoad(on){
  document.getElementById('loading').style.display=on?'block':'none';
  const btn=document.getElementById('generateBtn');
  btn.disabled=on;
  document.getElementById('btnTxt').textContent=on?'PROCESSING...':'GENERATE QUOTE';
}

/* ── GENERATE ── */
let currentUrl='';
function doGenerate(){
  const time=document.getElementById('time').value.trim();
  const battery=document.getElementById('battery').value.trim();
  const carrier=document.getElementById('carrier').value.trim();
  const message=document.getElementById('message').value.trim();
  const errEl=document.getElementById('errbox');

  if(!time||!battery||!carrier||!message){
    errEl.textContent='⚠️ Semua field harus diisi!';
    errEl.style.display='block';
    showToast('Semua field harus diisi!',true);
    return;
  }
  errEl.style.display='none';

  const pa=document.getElementById('previewArea');
  pa.classList.remove('show');
  pa.style.display='none';

  setLoad(true);
  addLog('Generating: '+time+' | '+battery+'% | '+carrier,'info');

  currentUrl='https://brat.siputzx.my.id/iphone-quoted?time='+encodeURIComponent(time)+'&batteryPercentage='+battery+'&carrierName='+encodeURIComponent(carrier)+'&messageText='+encodeURIComponent(message)+'&emojiStyle=apple';

  const img=document.getElementById('previewImage');
  img.onload=function(){
    pa.style.display='flex';
    pa.classList.add('show');
    setLoad(false);
    addLog('Berhasil dibuat untuk '+carrier,'ok');
    showToast('Quote berhasil dibuat! ✨');
  };
  img.onerror=function(){
    setLoad(false);
    errEl.textContent='❌ Gagal memuat gambar. Coba lagi.';
    errEl.style.display='block';
    addLog('Gagal load gambar dari API','err');
    showToast('Gagal memuat gambar!',true);
  };
  img.src=currentUrl;
  document.getElementById('downloadBtn').href=currentUrl;
}

document.getElementById('generateBtn').addEventListener('click',function(e){e.preventDefault();doGenerate()});
document.getElementById('regenBtn').addEventListener('click',function(){doGenerate()});

/* ── DOWNLOAD ── */
document.getElementById('downloadBtn').addEventListener('click',async function(e){
  e.preventDefault();
  if(!currentUrl)return;
  try{
    const res=await fetch(currentUrl);
    const blob=await res.blob();
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u;a.download='iphone-quote-'+Date.now()+'.png';a.click();
    URL.revokeObjectURL(u);
    addLog('Downloaded OK','ok');
    showToast('Download berhasil! 💾');
  }catch{
    window.open(currentUrl,'_blank');
    addLog('Opened in new tab','info');
  }
});
</script>
</body>
</html>
